name: Health Monitor

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/health-monitor.yml'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  check-all-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all portfolio repo CI status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repos = [
              'gosidehustlesisi/sierra-applied-ml',
              'gosidehustlesisi/sierra-healthcare-analytics',
              'gosidehustlesisi/sierra-pmo-analytics',
              'gosidehustlesisi/sierra-genai-engineering',
              'gosidehustlesisi/sierra-mobility-data',
              'gosidehustlesisi/sierra-data-governance',
              'gosidehustlesisi/sierra-public-sector-insights'
            ];

            const results = [];
            let crossRepoFailed = false;

            for (const repo of repos) {
              const [owner, name] = repo.split('/');
              try {
                // GITHUB_TOKEN can only read actions from the SAME repository
                // For other repos in the same org, it will get 403
                const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo: name,
                  per_page: 1
                });
                const latest = runs.workflow_runs[0];
                results.push({
                  repo,
                  status: latest?.conclusion || latest?.status || 'unknown',
                  run_id: latest?.id,
                  html_url: latest?.html_url
                });
              } catch (e) {
                if (e.status === 403 || e.status === 404) {
                  crossRepoFailed = true;
                  results.push({ 
                    repo, 
                    status: 'no-access',
                    error: 'GITHUB_TOKEN cannot read cross-repo workflow runs. Use a PAT with repo scope for cross-repo monitoring.'
                  });
                } else {
                  results.push({ repo, status: 'error', error: e.message });
                }
              }
            }

            const failed = results.filter(r => r.status === 'failure' || r.status === 'error');
            const noAccess = results.filter(r => r.status === 'no-access');

            console.log('=== Portfolio Health Check ===');
            console.table(results);

            if (noAccess.length > 0) {
              console.log(`⚠️ ${noAccess.length} repos could not be checked (cross-repo access denied):`);
              noAccess.forEach(r => console.log(`  - ${r.repo}: ${r.error}`));
              console.log('');
              console.log('To fix: Add a repository secret named CROSS_REPO_PAT with a Personal Access Token');
              console.log('that has "repo" and "workflow" scopes, then update this workflow to use secrets.CROSS_REPO_PAT');
            }

            if (failed.length > 0) {
              console.log(`❌ ${failed.length} repos have failed CI:`);
              failed.forEach(f => console.log(`  - ${f.repo}: ${f.status}`));

              // Create issue if any failed
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🚨 CI Failure Detected: ${failed.length} repos`,
                  body: failed.map(f => `- **${f.repo}**: ${f.status}${f.html_url ? ` ([View run](${f.html_url})` : ''}`).join('\n') + 
                        '\n\nAuto-generated by Health Monitor workflow.',
                  labels: ['ci-failure', 'auto-generated']
                });
                console.log('✅ Created issue for failures');
              } catch (issueErr) {
                console.log(`⚠️ Could not create issue: ${issueErr.message}`);
              }
            } else if (noAccess.length === repos.length) {
              console.log('⚠️ All repos returned "no-access" — cross-repo PAT not configured');
            } else {
              console.log('✅ All accessible repos green');
            }

            // Write summary
            const fs = require('fs');
            fs.writeFileSync('health-report.json', JSON.stringify(results, null, 2));
            
            // Also write step summary
            const summary = require('fs');
            summary.writeFileSync(process.env.GITHUB_STEP_SUMMARY, 
              `## Portfolio Health Check\n\n` +
              `| Repo | Status |\n` +
              `|---|---|\n` +
              results.map(r => `| ${r.repo} | ${r.status} |`).join('\n') +
              `\n\n${failed.length > 0 ? `❌ **${failed.length} failed**` : `✅ **All green**`}` +
              `${noAccess.length > 0 ? `\n\n⚠️ **${noAccess.length} repos** could not be checked (cross-repo access denied)` : ''}`
            );

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.json
          retention-days: 7
