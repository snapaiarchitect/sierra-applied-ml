version: '3.8'

services:
  ml-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sierra_applied_ml_container
    ports:
      - "8888:8888"  # Jupyter Notebook access
      - "8000:8000"  # FastAPI / API hosting headroom
    volumes:
      # Live-mount the directory to save generated plots directly back to the host tree
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
